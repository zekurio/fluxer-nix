# Updates one pin on update/<target>, runs CI on it, and pushes the commit to
# main when CI passes. A push with GITHUB_TOKEN starts no workflows, so CI does
# not run again on main; it already built this exact commit and filled the cache.
name: Update target

on:
  workflow_call:
    inputs:
      target:
        description: fluxer, fluxer-desktop or nixpkgs
        type: string
        required: true

env:
  BRANCH: update/${{ inputs.target }}

jobs:
  update:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.push.outputs.changed }}
    steps:
      # The run's own commit goes stale once an earlier target has pushed, so
      # start from the current main.
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update
        id: update
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET: ${{ inputs.target }}
        run: |
          case $TARGET in
            fluxer)
              bash pkgs/fluxer/update.sh
              title="Update Fluxer server to $(jq -r .version pkgs/fluxer/release.json)"
              ;;
            fluxer-desktop)
              bash pkgs/fluxer-desktop/update.sh
              title="Update fluxer-desktop to $(jq -r .version pkgs/fluxer-desktop/sources.json)"
              ;;
            nixpkgs)
              nix flake update nixpkgs
              title="Update nixpkgs to $(date -ud "@$(jq -r .nodes.nixpkgs.locked.lastModified flake.lock)" +%F)"
              ;;
            *)
              echo "unknown target $TARGET" >&2
              exit 1
              ;;
          esac
          echo "title=$title" >>"$GITHUB_OUTPUT"

      - name: Push
        id: push
        env:
          TITLE: ${{ steps.update.outputs.title }}
        run: |
          if git diff --quiet; then
            echo "Already up to date."
            echo changed=false >>"$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -qam "$TITLE"
          git push -f origin "HEAD:refs/heads/$BRANCH"
          echo changed=true >>"$GITHUB_OUTPUT"

  check:
    needs: update
    if: needs.update.outputs.changed == 'true'
    uses: ./.github/workflows/ci.yml
    with:
      ref: update/${{ inputs.target }}
    secrets: inherit

  # A failed check leaves the branch in place to inspect; the next run replaces
  # it.
  merge:
    needs: check
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.BRANCH }}

      # Not forced: if someone pushed to main during the check, the push fails
      # rather than landing an untested combination, and tomorrow's run retries.
      - name: Push to main
        run: |
          git push origin HEAD:main
          git push origin --delete "$BRANCH"
